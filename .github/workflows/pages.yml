name: Publicar site no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Remover fundo branco do brasão
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from PIL import Image
          from collections import deque
          import numpy as np

          src = "brasao-bocaina.png"
          dst = "brasao-bocaina-transparente.png"

          img = Image.open(src).convert("RGBA")
          a = np.array(img)
          rgb = a[:, :, :3]
          mask = np.all(rgb >= 245, axis=2)

          h, w = mask.shape
          seen = np.zeros_like(mask, dtype=bool)
          q = deque()

          for x in range(w):
              if mask[0, x]:
                  seen[0, x] = True; q.append((0, x))
              if mask[h-1, x] and not seen[h-1, x]:
                  seen[h-1, x] = True; q.append((h-1, x))
          for y in range(h):
              if mask[y, 0] and not seen[y, 0]:
                  seen[y, 0] = True; q.append((y, 0))
              if mask[y, w-1] and not seen[y, w-1]:
                  seen[y, w-1] = True; q.append((y, w-1))

          while q:
              y, x = q.popleft()
              for dy, dx in ((1,0),(-1,0),(0,1),(0,-1)):
                  yy, xx = y + dy, x + dx
                  if 0 <= yy < h and 0 <= xx < w and mask[yy, xx] and not seen[yy, xx]:
                      seen[yy, xx] = True
                      q.append((yy, xx))

          a[seen, 3] = 0
          Image.fromarray(a).save(dst, optimize=True)
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
